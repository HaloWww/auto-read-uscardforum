name: likeUser

on:
  schedule:
    - cron: '17 4 * * 6'
  workflow_dispatch:
    inputs:
      run_time_minutes:
        description: '正式阅读总时长（分钟）'
        type: number
        default: 20
      preview_rotation:
        description: '仅预览四周账号分配，不登录、不点赞、不推进进度'
        type: boolean
        default: false

concurrency:
  group: forum-reading-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      USERNAMES: ${{ secrets.USERNAMES }}
      PASSWORDS: ${{ secrets.PASSWORDS }}
      WEBSITE: ${{ secrets.WEBSITE || 'https://www.uscardforum.com' }}
      RUN_TIME_LIMIT_MINUTES: ${{ inputs.run_time_minutes || '20' }}
      MAX_CONCURRENT_ACCOUNTS: ${{ secrets.MAX_CONCURRENT_ACCOUNTS || '3' }}
      NAV_TIMEOUT_MS: ${{ secrets.NAV_TIMEOUT_MS || '60000' }}
      LIKE_SPECIFIC_USER: 'true'
      PREVIEW_LIKE_ROTATION: ${{ inputs.preview_rotation || false }}
      GITHUB_TOKEN: ${{ github.token }}
      SPECIFIC_USER: ${{ secrets.SPECIFIC_USER || 'halowang' }}
      AUTO_LIKE: ${{ secrets.AUTO_LIKE || 'true' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PROXY_URL: ${{ secrets.PROXY_URL }}
      PROXY_TYPE: ${{ secrets.PROXY_TYPE }}
      PROXY_HOST: ${{ secrets.PROXY_HOST }}
      PROXY_PORT: ${{ secrets.PROXY_PORT }}
      PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
      PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --omit=dev
      - run: npm start
