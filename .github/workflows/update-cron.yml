name: Update Workflow Cron

on:
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      - name: Randomize schedules (07:00–23:59 Asia/Shanghai)
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { randomInt } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const hour = randomInt(7, 24);
          const minute = randomInt(0, 60);
          const utcHour = (hour + 16) % 24;
          const saturdayUtcDay = hour < 8 ? 5 : 6;
          for (const [file, day] of [
            ['cron_bypassCF.yaml', '*'],
            ['cron_bypassCF_likeUser.yaml', String(saturdayUtcDay)],
          ]) {
            const path = `.github/workflows/${file}`;
            const source = readFileSync(path, 'utf8');
            const pattern = /cron: ['"][^'"]+['"]/g;
            if ([...source.matchAll(pattern)].length !== 1) throw new Error(`Unexpected schedule in ${file}`);
            writeFileSync(path, source.replace(pattern, `cron: '${minute} ${utcHour} * * ${day}'`));
          }
          console.log(`北京时间 ${hour}:${String(minute).padStart(2, '0')}`);
          JS
      - name: Commit schedules
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cron_bypassCF.yaml .github/workflows/cron_bypassCF_likeUser.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Randomize reading schedules'
          git push
