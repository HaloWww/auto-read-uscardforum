name: readLike

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      login_only:
        description: '仅验证全部账号登录'
        type: boolean
        default: false
      verify_reading:
        description: '验证登录及阅读初始化，不点赞或发送通知'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      USERNAMES: ${{ secrets.USERNAMES }}
      PASSWORDS: ${{ secrets.PASSWORDS }}
      WEBSITE: ${{ secrets.WEBSITE || 'https://www.uscardforum.com' }}
      RUN_TIME_LIMIT_MINUTES: ${{ secrets.RUN_TIME_LIMIT_MINUTES || '20' }}
      MAX_CONCURRENT_ACCOUNTS: ${{ secrets.MAX_CONCURRENT_ACCOUNTS || '3' }}
      NAV_TIMEOUT_MS: ${{ secrets.NAV_TIMEOUT_MS || '60000' }}
      LOGIN_ONLY: ${{ inputs.login_only || false }}
      VERIFY_READING: ${{ inputs.verify_reading || false }}
      LIKE_SPECIFIC_USER: 'false'
      SPECIFIC_USER: ${{ secrets.SPECIFIC_USER || 'halowang' }}
      AUTO_LIKE: ${{ secrets.AUTO_LIKE || 'true' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PROXY_URL: ${{ secrets.PROXY_URL }}
      PROXY_TYPE: ${{ secrets.PROXY_TYPE }}
      PROXY_HOST: ${{ secrets.PROXY_HOST }}
      PROXY_PORT: ${{ secrets.PROXY_PORT }}
      PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
      PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --omit=dev
      - run: npm start
